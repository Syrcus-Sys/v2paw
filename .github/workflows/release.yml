name: Release
# Lays out the release jobs and hands each one the secrets it needs. The build itself is kept
# elsewhere: every job checks it out, runs one stage of it, and uploads what the stage printed and
# passed on only after sealing it. What a job caches is sealed too, under keys that name nothing.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Client branch, tag or commit to build
        default: main
        required: true
      channel:
        description: stable becomes the release every client updates to; preview is a pre-release
        type: choice
        options: [stable, preview]
        default: stable
      targets:
        description: all builds and publishes everything; apple only uploads to App Store Connect; build builds every platform and publishes nothing
        type: choice
        options: [all, apple, build]
        default: all
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  REF: ${{ inputs.ref }}
  CHANNEL: ${{ inputs.channel }}
  TARGETS: ${{ inputs.targets }}
jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      kernel-android: ${{ steps.stage.outputs.kernel-android }}
      kernel-windows: ${{ steps.stage.outputs.kernel-windows }}
      kernel-apple: ${{ steps.stage.outputs.kernel-apple }}
      gradle: ${{ steps.stage.outputs.gradle }}
      ccache: ${{ steps.stage.outputs.ccache }}
    steps:
      - &tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.TOOLS_REPOSITORY }}
          ssh-key: ${{ secrets.TOOLS_SSH_KEY }}
          path: .tools
          persist-credentials: false
      - id: stage
        run: bash .tools/run resolve
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          CLIENT_REPOSITORY: ${{ secrets.CLIENT_REPOSITORY }}
          CLIENT_SSH_KEY: ${{ secrets.CLIENT_SSH_KEY }}
          PANEL_CLIENT_JSON: ${{ secrets.PANEL_CLIENT_JSON }}
          CLIENT_BUILD_JSON: ${{ secrets.CLIENT_BUILD_JSON }}
          GH_TOKEN: ${{ github.token }}
      - &sealed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: out-${{ github.job }}
          path: ${{ runner.temp }}/sealed
          if-no-files-found: ignore
          retention-days: 1

  android:
    name: Android
    needs: resolve
    if: inputs.targets != 'apple'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - *tools
      - &inbox
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: out-*
          merge-multiple: true
          path: ${{ runner.temp }}/inbox
      - id: kernel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs.kernel-android }}
          path: ${{ runner.temp }}/cache/kernel
      - id: gradle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs.gradle }}
          restore-keys: gradle-
          path: ${{ runner.temp }}/cache/gradle
      - id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs.ccache }}
          restore-keys: ccache-
          path: ${{ runner.temp }}/cache/ccache
      - run: bash .tools/run android
        env:
          GRADLE_CACHE_HIT: ${{ steps.gradle.outputs.cache-hit }}
          CCACHE_CACHE_HIT: ${{ steps.ccache.outputs.cache-hit }}
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          CLIENT_REPOSITORY: ${{ secrets.CLIENT_REPOSITORY }}
          CLIENT_SSH_KEY: ${{ secrets.CLIENT_SSH_KEY }}
          CORE_REPOSITORY: ${{ secrets.CORE_REPOSITORY }}
          CORE_SSH_KEY: ${{ secrets.CORE_SSH_KEY }}
          CORE_KNOWN_HOSTS: ${{ secrets.CORE_KNOWN_HOSTS }}
          PANEL_CLIENT_JSON: ${{ secrets.PANEL_CLIENT_JSON }}
          CLIENT_BUILD_JSON: ${{ secrets.CLIENT_BUILD_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - *sealed
      # A kernel is cached once admitted, so a later failure in the job need not rebuild it.
      - if: always() && steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs.kernel-android }}
          path: ${{ runner.temp }}/cache/kernel
      - if: steps.gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs.gradle }}
          path: ${{ runner.temp }}/cache/gradle
      - if: steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs.ccache }}
          path: ${{ runner.temp }}/cache/ccache

  windows-kernel:
    name: Windows kernel
    needs: resolve
    if: inputs.targets != 'apple'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *tools
      - *inbox
      - id: kernel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs.kernel-windows }}
          path: ${{ runner.temp }}/cache/kernel
      - run: bash .tools/run windows-kernel
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          CLIENT_REPOSITORY: ${{ secrets.CLIENT_REPOSITORY }}
          CLIENT_SSH_KEY: ${{ secrets.CLIENT_SSH_KEY }}
          CORE_REPOSITORY: ${{ secrets.CORE_REPOSITORY }}
          CORE_SSH_KEY: ${{ secrets.CORE_SSH_KEY }}
          CORE_KNOWN_HOSTS: ${{ secrets.CORE_KNOWN_HOSTS }}
          PANEL_CLIENT_JSON: ${{ secrets.PANEL_CLIENT_JSON }}
          CLIENT_BUILD_JSON: ${{ secrets.CLIENT_BUILD_JSON }}
      - *sealed
      # A kernel is cached once admitted, so a later failure in the job need not rebuild it.
      - if: always() && steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs.kernel-windows }}
          path: ${{ runner.temp }}/cache/kernel

  windows:
    name: Windows
    needs: [resolve, windows-kernel]
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - *tools
      - *inbox
      - run: bash .tools/run windows
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          CLIENT_REPOSITORY: ${{ secrets.CLIENT_REPOSITORY }}
          CLIENT_SSH_KEY: ${{ secrets.CLIENT_SSH_KEY }}
          PANEL_CLIENT_JSON: ${{ secrets.PANEL_CLIENT_JSON }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - *sealed

  apple:
    name: Apple
    needs: resolve
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - *tools
      - *inbox
      - id: kernel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs.kernel-apple }}
          path: ${{ runner.temp }}/cache/kernel
      - run: bash .tools/run apple
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          CLIENT_REPOSITORY: ${{ secrets.CLIENT_REPOSITORY }}
          CLIENT_SSH_KEY: ${{ secrets.CLIENT_SSH_KEY }}
          CORE_REPOSITORY: ${{ secrets.CORE_REPOSITORY }}
          CORE_SSH_KEY: ${{ secrets.CORE_SSH_KEY }}
          CORE_KNOWN_HOSTS: ${{ secrets.CORE_KNOWN_HOSTS }}
          PANEL_CLIENT_JSON: ${{ secrets.PANEL_CLIENT_JSON }}
          CLIENT_BUILD_JSON: ${{ secrets.CLIENT_BUILD_JSON }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_KEY_BASE64: ${{ secrets.APPLE_ASC_KEY_BASE64 }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_INSTALLER_P12_BASE64: ${{ secrets.APPLE_INSTALLER_P12_BASE64 }}
          APPLE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          APPLE_PROFILES_BASE64: ${{ secrets.APPLE_PROFILES_BASE64 }}
      - *sealed
      # A kernel is cached once admitted, so a later failure in the job need not rebuild it.
      - if: always() && steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs.kernel-apple }}
          path: ${{ runner.temp }}/cache/kernel

  publish:
    name: Publish
    needs: [resolve, android, windows]
    if: inputs.targets == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - *tools
      - *inbox
      - run: bash .tools/run publish
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          PANEL_CLIENT_JSON: ${{ secrets.PANEL_CLIENT_JSON }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
      - *sealed
